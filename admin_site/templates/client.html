<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parking Reservation - Client Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px 0;
        }

        .client-container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .status-banner {
            background: linear-gradient(135deg, #28a745, #20c997);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .status-banner.full {
            background: linear-gradient(135deg, #dc3545, #e74c3c);
        }

        .reservation-form {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
        }

        .form-control {
            border-radius: 10px;
            border: 2px solid #e9ecef;
            padding: 12px 15px;
            margin-bottom: 15px;
        }

        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }

        .btn-reserve {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            font-weight: 600;
            width: 100%;
            color: white;
            font-size: 1.1rem;
        }

        .btn-reserve:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-reserve:disabled {
            opacity: 0.6;
            transform: none;
            box-shadow: none;
        }

        .cost-display {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            margin: 15px 0;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            color: #667eea;
        }

        .alert {
            border-radius: 10px;
            border: none;
        }

        .loading {
            display: none;
        }

        .loading.show {
            display: block;
        }
    </style>
</head>

<body>
    <div class="client-container">
        <!-- Header -->
        <div class="header-card">
            <h1><i class="fas fa-parking"></i> Smart Parking System</h1>
            <p class="text-muted">Reserve your parking spot in advance</p>
            <div class="live-status" id="live-status" style="margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 8px;">
                <div class="d-flex justify-content-center align-items-center gap-3">
                    <div class="status-indicator">
                        <i class="fas fa-circle text-success" id="connection-indicator"></i>
                        <span id="connection-text">Connecting...</span>
                    </div>
                    <div class="slot-info">
                        <span id="slot-count">Loading...</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status Banner -->
        <div class="status-banner" id="status-banner">
            <i class="fas fa-info-circle"></i>
            <span id="status-message">Checking availability...</span>
        </div>

        <!-- Reservation Form -->
        <div class="reservation-form">
            <h3><i class="fas fa-calendar-plus"></i> Make a Reservation</h3>

            <form id="reservation-form">
                <div class="row">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name *</label>
                        <input type="text" class="form-control" id="name" name="name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="number_plate" class="form-label">Number Plate *</label>
                        <input type="text" class="form-control" id="number_plate" name="number_plate" placeholder="ABC-1234" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label for="client_email" class="form-label">Email Address</label>
                        <input type="email" class="form-control" id="client_email" name="client_email">
                    </div>
                    <div class="col-md-6">
                        <label for="start_time" class="form-label">Start Time *</label>
                        <input type="datetime-local" class="form-control" id="start_time" name="start_time" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6">
                        <label for="duration" class="form-label">Duration (Hours) *</label>
                        <select class="form-control" id="duration" name="duration" required>
                            <option value="">Select duration</option>
                            <option value="1">1 Hour</option>
                            <option value="2">2 Hours</option>
                            <option value="3">3 Hours</option>
                            <option value="4">4 Hours</option>
                            <option value="6">6 Hours</option>
                            <option value="8">8 Hours</option>
                            <option value="12">12 Hours</option>
                            <option value="24">24 Hours</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="payment_method" class="form-label">Payment Method</label>
                        <select class="form-control" id="payment_method" name="payment_method">
                            <option value="cash">Cash</option>
                            <option value="card">Credit/Debit Card</option>
                            <option value="mobile">Mobile Payment</option>
                        </select>
                    </div>
                </div>

                <div class="cost-display" id="cost-display" style="display: none;">
                    <i class="fas fa-dollar-sign"></i>
                    <span id="total-cost">$0.00</span>
                    <small class="text-muted d-block">Total cost for your reservation</small>
                </div>

                <button type="submit" class="btn btn-reserve" id="submit-btn" disabled>
                    <span class="loading" id="loading">
                        <i class="fas fa-spinner fa-spin"></i> Processing...
                    </span>
                    <span class="btn-text">
                        <i class="fas fa-check"></i> Reserve Parking Spot
                    </span>
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        // Socket.IO connection to admin portal
        const socket = io();

        // Utility function to parse time string (already in local time)
        function convertToLocalTime(timeString) {
            if (!timeString) return null;
            // Time is already stored in local time, so just parse it directly
            return new Date(timeString);
        }
        
        // Utility function to format time for display
        function formatLocalTime(date) {
            if (!date) return '';
            return date.toLocaleString('en-US', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            });
        }

        // Set default start time to current time
        document.getElementById('start_time').value = new Date().toISOString().slice(0, 16);

        // Check availability on page load
        checkAvailability();

        // Update cost when duration changes
        document.getElementById('duration').addEventListener('change', updateCost);

        // Form submission
        document.getElementById('reservation-form').addEventListener('submit', handleReservation);

        // Socket.IO event handlers for real-time updates
        socket.on('connect', function() {
            console.log('Connected to admin portal for real-time updates');
            updateConnectionStatus(true);
        });

        socket.on('disconnect', function() {
            console.log('Disconnected from admin portal');
            updateConnectionStatus(false);
        });

        socket.on('occupancy_update', function(data) {
            console.log('Received occupancy update:', data);
            updateAvailabilityDisplay(data);
        });

        socket.on('detection_update', function(data) {
            console.log('Received detection update:', data);
            // Individual slot updates - we can use this for more detailed info if needed
        });

        function updateConnectionStatus(connected) {
            const banner = document.getElementById('status-banner');
            const message = document.getElementById('status-message');
            const connectionIndicator = document.getElementById('connection-indicator');
            const connectionText = document.getElementById('connection-text');
            
            if (connected) {
                message.innerHTML = `<i class="fas fa-wifi"></i> Connected to live parking system`;
                banner.className = 'status-banner';
                connectionIndicator.className = 'fas fa-circle text-success';
                connectionText.textContent = 'Live';
            } else {
                message.innerHTML = `<i class="fas fa-wifi-slash"></i> Disconnected - using cached data`;
                banner.className = 'status-banner full';
                connectionIndicator.className = 'fas fa-circle text-danger';
                connectionText.textContent = 'Offline';
            }
            banner.style.display = 'block';
        }

        function updateAvailabilityDisplay(data) {
                const banner = document.getElementById('status-banner');
                const message = document.getElementById('status-message');
                const submitBtn = document.getElementById('submit-btn');
            const slotCount = document.getElementById('slot-count');

            const freeSlots = data.free_slots || 0;
            const totalSlots = data.total_slots || 0;
            const reservedSlots = data.reserved_slots || 0;
            const nextAvailableTime = data.next_available_time;

            // Update live status display
            if (slotCount) {
                if (reservedSlots === 0) {
                    // No reservations - show all slots as free
                    slotCount.innerHTML = `<i class="fas fa-car"></i> ${totalSlots} slots available`;
                } else if (freeSlots > 0) {
                    // Some slots free, some reserved
                    slotCount.innerHTML = `<i class="fas fa-car"></i> ${freeSlots} free / ${totalSlots} total`;
                } else {
                    // All slots reserved
                    slotCount.innerHTML = `<i class="fas fa-car"></i> All ${totalSlots} slots reserved`;
                }
            }

            if (reservedSlots === 0) {
                // No reservations - all slots are free
                banner.className = 'status-banner';
                message.innerHTML = `<i class="fas fa-check-circle"></i> Parking Available - All ${totalSlots} slots free`;
                submitBtn.disabled = false;
            } else if (freeSlots > 0) {
                // Some slots available
                    banner.className = 'status-banner';
                message.innerHTML = `<i class="fas fa-check-circle"></i> Parking Available - ${freeSlots} slots free (${reservedSlots} reserved)`;
                    submitBtn.disabled = false;
                } else {
                // All slots reserved - show next available time
                    banner.className = 'status-banner full';
                if (nextAvailableTime) {
                    const nextTime = formatLocalTime(convertToLocalTime(nextAvailableTime));
                    message.innerHTML = `<i class="fas fa-clock"></i> Parking Full - Next slot available at ${nextTime}`;
                } else {
                    message.innerHTML = `<i class="fas fa-times-circle"></i> Parking Full - All ${totalSlots} slots reserved`;
                }
                    submitBtn.disabled = true;
                }

                banner.style.display = 'block';
        }

        async function checkAvailability() {
            try {
                const response = await fetch('/api/client/availability');
                const data = await response.json();

                // Use the same logic as real-time updates
                updateAvailabilityDisplay(data);
            } catch (error) {
                console.error('Error checking availability:', error);
                showAlert('Error checking parking availability', 'danger');
            }
        }

        function updateCost() {
            const duration = document.getElementById('duration').value;
            const costDisplay = document.getElementById('cost-display');
            const totalCost = document.getElementById('total-cost');

            if (duration) {
                const hourlyRate = 5.0; // $5 per hour
                const cost = duration * hourlyRate;
                totalCost.textContent = `$${cost.toFixed(2)}`;
                costDisplay.style.display = 'block';
            } else {
                costDisplay.style.display = 'none';
            }
        }

        async function handleReservation(event) {
            event.preventDefault();

            const form = event.target;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Validate required fields
            if (!data.name || !data.number_plate || !data.duration) {
                showAlert('Please fill in all required fields (Name, Number Plate, Duration)', 'danger');
                return;
            }

            // Add current timestamp if start_time is not set
            if (!data.start_time) {
                data.start_time = new Date().toISOString();
            }

            // Show loading state
            const submitBtn = document.getElementById('submit-btn');
            const loading = document.getElementById('loading');
            const btnText = document.querySelector('.btn-text');

            submitBtn.disabled = true;
            loading.classList.add('show');
            btnText.style.display = 'none';

            try {
                console.log('Submitting reservation data:', data);
                
                const response = await fetch('/api/client/reserve', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                console.log('Response status:', response.status);
                const result = await response.json();
                console.log('Response data:', result);

                if (result.success) {
                    showAlert(`Reservation request submitted successfully! Request ID: ${result.request_id}`, 'success');
                    form.reset();
                    document.getElementById('start_time').value = new Date().toISOString().slice(0, 16);
                    document.getElementById('cost-display').style.display = 'none';
                    checkAvailability(); // Refresh availability
                } else {
                    showAlert(result.error || 'Failed to submit reservation request', 'danger');
                }
            } catch (error) {
                console.error('Error submitting reservation:', error);
                showAlert('Error submitting reservation request: ' + error.message, 'danger');
            } finally {
                // Hide loading state
                submitBtn.disabled = false;
                loading.classList.remove('show');
                btnText.style.display = 'inline';
            }
        }

        function showAlert(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;

            // Insert after the status banner
            const statusBanner = document.getElementById('status-banner');
            statusBanner.parentNode.insertBefore(alertDiv, statusBanner.nextSibling);

            // Auto-remove after 5 seconds
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.parentNode.removeChild(alertDiv);
                }
            }, 5000);
        }

        // Check availability every 60 seconds as fallback (real-time updates via Socket.IO)
        setInterval(checkAvailability, 60000);
    </script>
</body>

</html>
