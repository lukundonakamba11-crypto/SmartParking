{% extends "base.html" %}
{% block title %}Reset Password - Smart Parking{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-lg-6">
        <div class="card"><div class="card-body p-5">
            <h2 class="fw-bold mb-3"><i class="fas fa-key text-primary"></i> Reset password</h2>
            <p class="text-muted">Enter your registered vehicle plate. If an email is on your account and mail delivery is configured, a one-hour reset link will be sent.</p>
            <form method="post">
                <label class="form-label" for="number_plate">Vehicle number plate</label>
                <input class="form-control mb-4" id="number_plate" name="number_plate" autocomplete="username" required>
                <button class="btn btn-primary w-100" type="submit">Send reset link</button>
            </form>
            <p class="mt-4 mb-0"><a href="{{ url_for('client_login') }}">Back to login</a></p>
        </div></div>
    </div></div>
</div>
{% endblock %}
