{% extends "base.html" %}
{% block title %}Choose a New Password - Smart Parking{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center"><div class="col-lg-6">
        <div class="card"><div class="card-body p-5">
            <h2 class="fw-bold mb-3"><i class="fas fa-lock text-primary"></i> Choose a new password</h2>
            <p class="text-muted">Your reset link is valid for one hour.</p>
            <form method="post">
                <label class="form-label" for="password">New password</label>
                <input class="form-control mb-4" type="password" id="password" name="password" minlength="8" autocomplete="new-password" required>
                <button class="btn btn-primary w-100" type="submit">Update password</button>
            </form>
        </div></div>
    </div></div>
</div>
{% endblock %}
